[package]
name = "kafka-buffer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.79"
capnp = "0.21.5"
clap = { version = "4.4.11", features = ["derive"] }
futures = "0.3.30"
futures-util = "0.3.25"
http = "1.1.0"
http-body-util = "0.1.2"
hyper = { version = "1.4.1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
lazy_static = "1.4"
pest = "2.7"
pest_derive = "2.7"
prometheus = "0.14.0"
rand = "0.9.2"
rand_distr = "0.5.1"
rdkafka = "0.38.0"
redis = "0.32.5"
serde = "1.0.209"
serde_json = "1.0.127"
sidekiq = { git = 'https://github.com/bergey/rust-sidekiq.git', branch = 'kafka-buffer' }
tokio = { version = "1", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt", "json"] }
url = "2.5.0"

[build-dependencies]
capnpc = "0.21.4"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "encoding_speed"
harness = false
